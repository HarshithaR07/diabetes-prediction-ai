<!DOCTYPE html>
<html>
<head>
    <title>{{ t.doctor_title }}</title>
    <style>
        #map {
            height: 500px;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>{{ t.doctor_title }}</h1>
    <p><a href="/">{{ t.back_to_form }}</a> | <a href="/dashboard">{{ t.dashboard_link }}</a> | <a href="/logout">{{ t.logout }}</a></p>

    <p id="status">{{ t.doctor_intro }}</p>
    <button onclick="findNearbyDoctors()">{{ t.find_doctors_button }}</button>

    <div id="map"></div>

    <script>
        let map;

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 12.9716, lng: 77.5946 },
                zoom: 13,
                mapId: "DEMO_MAP_ID"
            });
        }

        async function findNearbyDoctors() {
            document.getElementById('status').innerText = "Getting your location...";

            if (!navigator.geolocation) {
                document.getElementById('status').innerText = "Geolocation not supported by your browser.";
                return;
            }

            navigator.geolocation.getCurrentPosition(async function(position) {
                const userLocation = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };

                map.setCenter(userLocation);

                new google.maps.marker.AdvancedMarkerElement({
                    position: userLocation,
                    map: map,
                    title: "You are here"
                });

                document.getElementById('status').innerText = "Searching nearby doctors...";

                try {
                    const { Place, SearchNearbyRankPreference } = await google.maps.importLibrary("places");

                    const request = {
                        fields: ["displayName", "location"],
                        locationRestriction: {
                            center: userLocation,
                            radius: 5000,
                        },
                        includedPrimaryTypes: ["doctor", "hospital"],
                        maxResultCount: 15,
                        rankPreference: SearchNearbyRankPreference.DISTANCE,
                    };

                    const { places } = await Place.searchNearby(request);

                    if (places && places.length > 0) {
                        document.getElementById('status').innerText = `Found ${places.length} nearby doctors/hospitals.`;
                        places.forEach(place => {
                            const marker = new google.maps.marker.AdvancedMarkerElement({
                                position: place.location,
                                map: map,
                                title: place.displayName
                            });

                            const infoWindow = new google.maps.InfoWindow({
                                content: `<strong>${place.displayName}</strong>`
                            });

                            marker.addListener('click', () => {
                                infoWindow.open(map, marker);
                            });
                        });
                    } else {
                        document.getElementById('status').innerText = "No results found nearby.";
                    }
                } catch (error) {
                    document.getElementById('status').innerText = "Error fetching nearby places: " + error.message;
                    console.error(error);
                }

            }, function() {
                document.getElementById('status').innerText = "Unable to retrieve your location. Please allow location access.";
            });
        }
    </script>

    <script src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_key }}&libraries=places,marker&callback=initMap&loading=async" async defer></script>
</body>
</html>
