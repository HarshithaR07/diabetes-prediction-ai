<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Login - Diabetes Care</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            background: #f4f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            border: none;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .doctor-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #198754;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px;
        }

        .btn-login {
            background: #198754;
            border: none;
            color: white;
            padding: 11px;
            border-radius: 10px;
        }

        .btn-login:hover {
            background: #157347;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card login-card mx-auto">

        <div class="card-body p-4 p-md-5">

            <div class="doctor-icon">
                🩺
            </div>

            <h2 class="text-center fw-bold mb-2">
                Doctor Login
            </h2>

            <p class="text-center text-muted mb-4">
                Login to manage patient appointments
            </p>


            <!-- FLASH MESSAGES -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}

                    {% for category, message in messages %}

                        <div class="alert alert-{{ category }} alert-dismissible fade show">

                            {{ message }}

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="alert">
                            </button>

                        </div>

                    {% endfor %}

                {% endif %}
            {% endwith %}


            <!-- LOGIN FORM -->
            <form method="POST" action="{{ url_for('doctor_login') }}">

                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label fw-semibold">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Enter doctor email"
                        required>

                </div>


                <div class="mb-4">

                    <label
                        for="password"
                        class="form-label fw-semibold">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required>

                </div>


                <button
                    type="submit"
                    class="btn btn-login w-100">
                    Login
                </button>

            </form>


            <div class="text-center mt-4">

                <a
                    href="{{ url_for('login') }}"
                    class="text-decoration-none">
                    ← Back to Patient Login
                </a>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
